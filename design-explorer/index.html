<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mr Pork Design Explorer</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/explorer.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div class="shell" id="shell">
    <header class="topbar">
      <button class="topbar__drawer" id="toggle-tree" type="button" aria-label="Toggle design tree">☰ Tree</button>
      <h1 class="topbar__title">Mr Pork Design Explorer <span class="topbar__phase">Phase 1 · Reference</span></h1>
      <button class="topbar__action" id="copy-link" type="button">Copy Review Link</button>
      <button class="topbar__drawer" id="toggle-info" type="button" aria-label="Toggle design info">Info ⓘ</button>
    </header>

    <aside class="panel panel--tree" aria-label="Design tree">
      <div class="panel__head">
        <label class="visually-hidden" for="search">Search designs</label>
        <input id="search" class="search" type="search" placeholder="Search name, ID, module, state…" autocomplete="off">
        <div class="chips" id="filters" role="group" aria-label="Filter designs"></div>
        <p class="panel__count" id="result-count"></p>
      </div>
      <nav class="tree" id="tree" aria-label="Design hierarchy"></nav>
      <p class="tree__empty" id="tree-empty" hidden>No designs match.</p>
    </aside>

    <main class="stage">
      <nav class="crumb" id="breadcrumb" aria-label="Design path"></nav>
      <div class="notices" id="notices" hidden></div>
      <div class="versions" id="versions" role="group" aria-label="Design version" hidden></div>
      <div class="toolbar" id="toolbar">
        <div class="segmented" id="devices" role="group" aria-label="Device preset"></div>
        <div class="segmented" id="view-modes" role="group" aria-label="View mode"></div>
        <span class="toolbar__scale" id="scale-label" aria-live="polite"></span>
      </div>
      <div id="banners"></div>
      <div class="preview" id="preview" tabindex="0" aria-label="UI preview"></div>
    </main>

    <aside class="panel panel--info" aria-label="Design info">
      <div class="info" id="info"></div>
    </aside>

    <footer class="footer" id="footer-path"></footer>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  </div>

  <!-- Classic scripts, shared with prototype iframes: one copy of the tier thresholds and the message protocol. -->
  <script src="prototype-runtime/tiers.js"></script>
  <script src="prototype-runtime/protocol.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
