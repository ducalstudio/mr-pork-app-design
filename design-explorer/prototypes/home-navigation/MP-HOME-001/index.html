<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home — Member (Draft)</title>
  <!-- Order matters: shared tier + protocol scripts, then the client (sets data-tier before first paint), then CSS. -->
  <script src="../../../prototype-runtime/tiers.js"></script>
  <script src="../../../prototype-runtime/protocol.js"></script>
  <script src="../../../prototype-runtime/client.js"></script>
  <link rel="stylesheet" href="../../_ui-kit/tokens.css">
  <link rel="stylesheet" href="../../_ui-kit/font-inter.css"><!-- Inter: provisional Draft font (To Verify), not an approved brand font -->
  <link rel="stylesheet" href="../../_ui-kit/base.css">
  <link rel="stylesheet" href="../../_components/image-placeholder/component.css">
  <link rel="stylesheet" href="../../_components/app-header/component.css">
  <link rel="stylesheet" href="../../_components/summary-stat/component.css">
  <link rel="stylesheet" href="../../_components/fulfilment-option/component.css">
  <link rel="stylesheet" href="../../_components/promo-carousel/component.css">
  <link rel="stylesheet" href="../../_components/section-header/component.css">
  <link rel="stylesheet" href="../../_components/card-row/component.css">
  <link rel="stylesheet" href="../../_components/bottom-nav-reference/component.css">
  <link rel="stylesheet" href="screen.css">
  <link rel="stylesheet" href="responsive.css">
</head>
<body>
  <!--
    Draft. TEMPORARY PLACEHOLDERS / NOT SOURCE ASSETS (marked data-asset="temporary-placeholder"): the bell icon, the four
    navigation icons (line icons drawn for review, not approved iconography), the Pickup and Delivery illustrations, the
    Promotion artwork and the Shop & more imagery. Replace them when the original standalone assets are supplied.
    Section order is an intentional Draft IA change vs the Reference: Pickup / Delivery sits above the Promotion.
  -->
  <div class="home-top-inset" aria-hidden="true"></div>

  <main class="home-column" id="main">
    <header class="app-header home-header">
      <h1 class="app-header__title" id="greeting">Good morning, <span id="display-name">Ivan</span>!</h1>
      <button class="app-header__action" id="bell" type="button" data-destination="notifications" data-asset="temporary-placeholder" aria-label="Notifications">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5a5.5 5.5 0 0 0-5.5 5.5v3.4L4.5 16v1h15v-1l-2-3.6V9A5.5 5.5 0 0 0 12 3.5z"/><path d="M10 19.5a2 2 0 0 0 4 0"/></svg>
        <span class="app-header__dot" id="bell-dot" hidden></span>
      </button>
    </header>

    <section class="summary-stats home-summary" aria-label="Member summary">
      <button class="summary-stat" id="stat-credit" type="button" data-destination="my-credit">
        <span class="summary-stat__label">Credit</span>
        <span class="summary-stat__value"><span class="summary-stat__number"></span></span>
      </button>
      <button class="summary-stat" id="stat-points" type="button" data-destination="points-summary">
        <span class="summary-stat__label">Points</span>
        <span class="summary-stat__value"><span class="summary-stat__number"></span></span>
      </button>
      <button class="summary-stat" id="stat-rewards" type="button" data-destination="my-rewards">
        <span class="summary-stat__label">Rewards</span>
        <span class="summary-stat__value"><span class="summary-stat__number"></span></span>
      </button>
    </section>

    <section class="fulfil-options home-fulfil" aria-label="Start an order">
      <button class="fulfil-option fulfil-option--interactive" type="button" data-destination="store-selection">
        <span class="fulfil-option__art image-placeholder" data-asset="temporary-placeholder" aria-hidden="true"></span>
        <span class="fulfil-option__label">Pickup</span>
      </button>
      <!-- Future Scope: visually identical, inert. aria-disabled, no tabindex (not focusable), no href, no pressed state. -->
      <div class="fulfil-option fulfil-option--future" role="button" aria-disabled="true" data-scope="future">
        <span class="fulfil-option__art image-placeholder" data-asset="temporary-placeholder" aria-hidden="true"></span>
        <span class="fulfil-option__label">Delivery</span>
      </div>
    </section>

    <section class="promo-carousel home-promo" id="promo" role="region" aria-roledescription="carousel" aria-label="Promotions">
      <div class="promo-carousel__scroller" id="promo-scroller" data-asset="temporary-placeholder" tabindex="0" aria-label="Promotion slides"></div>
      <div class="promo-carousel__dots" aria-hidden="true"></div>
      <div class="promo-carousel__status" aria-live="polite"></div>
    </section>

    <section class="home-shop" aria-labelledby="shop-more-heading">
      <h2 class="section-header" id="shop-more-heading">Shop &amp; more</h2>
      <div class="card-row" id="card-row" data-asset="temporary-placeholder" tabindex="0" role="region" aria-label="Shop and more cards"></div>
    </section>
  </main>

  <!-- Reference Navigation (four tabs). Icons are neutral placeholders. Home is the selected tab. -->
  <nav class="bottom-nav" aria-label="Primary">
    <div class="bottom-nav__inner">
      <button class="bottom-nav__item" type="button" aria-current="page">
        <span class="bottom-nav__icon" data-asset="temporary-placeholder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11.5 12 5l8 6.5V20H4z"/><path d="M10 20v-5h4v5"/></svg></span>
        <span class="bottom-nav__label">Home</span>
      </button>
      <button class="bottom-nav__item" type="button">
        <span class="bottom-nav__icon" data-asset="temporary-placeholder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 4.5H6l2 10.5h10l2-7.5H7"/><circle cx="9.5" cy="19" r="1.3"/><circle cx="17" cy="19" r="1.3"/></svg></span>
        <span class="bottom-nav__label">Shop</span>
      </button>
      <button class="bottom-nav__item" type="button">
        <span class="bottom-nav__icon" data-asset="temporary-placeholder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10" width="16" height="10" rx="1"/><rect x="3" y="7" width="18" height="3" rx="1"/><path d="M12 7v13"/><path d="M12 7c-1.5-3-5-3-5-1.2S10.500 7 12 7zm0 0c1.5-3 5-3 5-1.2S13.500 7 12 7z"/></svg></span>
        <span class="bottom-nav__label">Rewards</span>
      </button>
      <button class="bottom-nav__item" type="button">
        <span class="bottom-nav__icon" data-asset="temporary-placeholder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.8"/><path d="M4.500 20c0-3.800 3.400-5.800 7.500-5.800s7.500 2 7.500 5.800"/></svg></span>
        <span class="bottom-nav__label">Account</span>
      </button>
    </div>
  </nav>

  <script src="../../_components/summary-stat/component.js"></script>
  <script src="../../_components/promo-carousel/component.js"></script>
  <script src="states/default.js"></script>
  <script>
    (function () {
      var S = Object.assign({}, window.HOME_STATE);
      var q = new URLSearchParams(location.search); // test-only overrides of the sample data
      if (q.has("name")) S.displayName = q.get("name");
      if (q.has("credit")) S.credit = Number(q.get("credit"));
      if (q.has("points")) S.points = Number(q.get("points"));
      if (q.has("rewards")) S.rewards = Number(q.get("rewards"));
      if (q.has("unread")) S.hasUnreadNotifications = q.get("unread") === "1";
      if (q.has("slides")) S.slides = Math.max(1, Math.min(12, Number(q.get("slides"))));
      if (q.has("cards")) S.cards = Math.max(1, Math.min(12, Number(q.get("cards"))));

      var P = window.MPProto;
      var $ = function (id) { return document.getElementById(id); };
      $("display-name").textContent = S.displayName;

      // Notification dot (no numeric badge). The accessible name changes with the state.
      $("bell-dot").hidden = !S.hasUnreadNotifications;
      $("bell").setAttribute("aria-label", S.hasUnreadNotifications ? "Notifications, unread" : "Notifications");

      // Member summary. Formatting is a PROPOSED rule (To Verify): Credit is a numeric balance only (two decimals, thousands separators,
      // no currency symbol or code); Points and Rewards are integers with thousands separators.
      var stats = [
        ["stat-credit", P.summaryStat.formatMoney(S.credit), "Credit " + P.summaryStat.formatMoney(S.credit) + ", opens My Credit"],
        ["stat-points", P.summaryStat.formatCount(S.points), "Points " + P.summaryStat.formatCount(S.points) + ", opens Points Summary"],
        ["stat-rewards", P.summaryStat.formatCount(S.rewards), "Rewards " + P.summaryStat.formatCount(S.rewards) + ", opens My Rewards"]
      ];
      stats.forEach(function (s) {
        var el = $(s[0]);
        el.querySelector(".summary-stat__number").textContent = s[1];
        el.setAttribute("aria-label", s[2]);
      });
      function fitAll() {
        stats.forEach(function (s) { P.summaryStat.fit($(s[0]).querySelector(".summary-stat__value"), 12); });
      }
      fitAll();
      window.addEventListener("resize", fitAll);
      window.addEventListener("load", fitAll);

      // Promotion slides: neutral placeholders (CMS images, count and crop rules are not defined).
      var scroller = $("promo-scroller");
      for (var i = 1; i <= S.slides; i++) {
        var slide = document.createElement("div");
        slide.className = "promo-carousel__slide";
        slide.setAttribute("role", "group");
        slide.setAttribute("aria-roledescription", "slide");
        slide.setAttribute("aria-label", i + " of " + S.slides);
        var ph = document.createElement("div");
        ph.className = "image-placeholder promo-carousel__art";
        ph.setAttribute("aria-hidden", "true");
        if (i === 1) {
          // SAMPLE DATA / NOT BUSINESS RULE: the Reference's own visible promo copy for slide 1 (the only slide the
          // Reference captures), kept so the placeholder still reads as "a promotion", not a blank wireframe tile.
          // Slides 2+ have no Reference evidence, so they stay unlabelled artwork only.
          ph.innerHTML = '<span class="promo-carousel__title">Mother’s Day</span><span class="promo-carousel__pill">From 1 May - 31 May 2026</span>';
        }
        slide.appendChild(ph);
        scroller.appendChild(slide);
      }
      P.promoCarousel.init($("promo"));

      // Shop & more: neutral cards; content type, source and destination are To Verify.
      var row = $("card-row");
      for (var c = 1; c <= S.cards; c++) {
        var card = document.createElement("div");
        card.className = "card-row__card";
        card.innerHTML = '<div class="card-row__title"><span class="card-row__glyph" aria-hidden="true"></span><span>' + S.cardLabel + '</span></div><div class="card-row__image image-placeholder" aria-hidden="true"></div>';
        row.appendChild(card);
      }
    })();
  </script>
</body>
</html>
