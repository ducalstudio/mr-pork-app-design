<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Transaction Type Filter (Draft)</title>
  <script src="../../../prototype-runtime/tiers.js"></script>
  <script src="../../../prototype-runtime/protocol.js"></script>
  <script src="../../../prototype-runtime/client.js"></script>
  <link rel="stylesheet" href="../../_ui-kit/tokens.css">
  <link rel="stylesheet" href="../../_ui-kit/reference-roles.css"><!-- Draft-only Reference-observed roles, not approved tokens -->
  <link rel="stylesheet" href="../../_ui-kit/font-inter.css"><!-- Inter: provisional Draft font (To Verify), not an approved brand font -->
  <link rel="stylesheet" href="../../_ui-kit/base.css">
  <link rel="stylesheet" href="../../_components/overlay/component.css">
  <link rel="stylesheet" href="../../_components/bottom-sheet/component.css">
  <link rel="stylesheet" href="../../_components/icon-button/component.css">
  <link rel="stylesheet" href="../../_components/radio-row/component.css">
  <link rel="stylesheet" href="../../_components/button/component.css">
  <link rel="stylesheet" href="screen.css">
</head>
<body>
  <!--
    Draft. ONE prototype, state-driven: ?state=all-types|top-up|buy-product|order-refund (which option starts selected).
    Partial Reference capture (400 wide, no position evidence): centered floating dialog, dimmed over the My Credit Draft,
    same precedent as Logout (see bottom-sheet/spec.md). TEMPORARY PLACEHOLDER / NOT A SOURCE ASSET: the close glyph.
  -->
  <iframe class="overlay__underlay" src="../MP-MEMBER-009/index.html" title="My Credit (Draft), dimmed" tabindex="-1" aria-hidden="true" inert sandbox="allow-scripts"></iframe>
  <div class="overlay" id="overlay">
    <div class="overlay__scrim"></div>
    <div class="overlay__layer">
      <section class="sheet sheet--floating" role="dialog" aria-modal="true" aria-labelledby="tf-title" tabindex="-1">
        <div class="sheet__head">
          <h2 class="sheet__title" id="tf-title">Transaction Type</h2>
          <button class="icon-button icon-button--flush-end" type="button" data-dismiss data-asset="temporary-placeholder" aria-label="Close">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg>
          </button>
        </div>
        <form class="type-filter-list" id="list">
          <label class="radio-row"><span class="radio-row__label">All types</span><input class="radio-row__input" type="radio" name="type" value="all-types"></label>
          <label class="radio-row"><span class="radio-row__label">Top-up</span><input class="radio-row__input" type="radio" name="type" value="top-up"></label>
          <label class="radio-row"><span class="radio-row__label">Buy product</span><input class="radio-row__input" type="radio" name="type" value="buy-product"></label>
          <label class="radio-row"><span class="radio-row__label">Order refund</span><input class="radio-row__input" type="radio" name="type" value="order-refund"></label>
        </form>
        <button class="button button--primary button--block type-filter-submit" type="button" data-destination="prototypes/credit/MP-MEMBER-009/index.html">Submit</button>
      </section>
    </div>
  </div>
  <script src="../../_components/overlay/component.js"></script>
  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      var state = q.get("state") || "all-types";
      var input = document.querySelector('input[value="' + state + '"]') || document.querySelector('input[value="all-types"]');
      input.checked = true;
      document.documentElement.setAttribute("data-state", state);
      MPProto.overlay.init(document.getElementById("overlay"), { dismissible: true });
    })();
  </script>
</body>
</html>
